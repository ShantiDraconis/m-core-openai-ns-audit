name: ATK kernel check

on:
  push:
    paths:
      - 'atk-kernel/**'
      - '.github/workflows/atk-kernel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    name: Lean 4 + Mathlib — compilação e auditoria de axiomas
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: atk-kernel
    steps:
      - uses: actions/checkout@v4

      - name: Instalar elan (gerenciador do Lean)
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          bash elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Versões
        shell: bash
        run: |
          mkdir -p reports
          lean --version | tee reports/toolchain.txt
          lake --version

      - name: Baixar Mathlib já compilada (cache oficial)
        shell: bash
        run: |
          lake exe cache get || (lake update && lake exe cache get)

      - name: lake build
        id: build
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          lake build 2>&1 | tee reports/build.log

      - name: "Auditoria por arquivo (kernel + #print axioms)"
        shell: bash
        run: |
          : > reports/file_status.txt
          for f in ATK/*.lean; do
            m=$(basename "$f" .lean)
            if lake env lean "$f" > "reports/audit_${m}.log" 2>&1; then
              echo "$f OK" >> reports/file_status.txt
            else
              echo "$f FAIL" >> reports/file_status.txt
            fi
          done
          cat reports/file_status.txt
          cp lake-manifest.json reports/ || true

      - name: Relatório de certificação
        id: report
        shell: bash
        run: |
          set +e
          python3 scripts/check_axioms.py
          code=$?
          cat reports/report.md >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atk-kernel-report
          path: atk-kernel/reports/


  ns-data:
    name: Navier–Stokes — Taylor–Green, razão S/(νz)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Simular Taylor–Green (64³, Re = 100, t ≤ 3) e resumir
        working-directory: atk-kernel/ns_data
        shell: bash
        run: |
          pip install -q numpy
          python3 taylor_green.py 64 100 3 0.01 tg_ci_N64_Re100_T3.csv
          python3 analyze_ns.py 100 tg_ci_N64_Re100_T3.csv
          echo "---- execuções completas (t ≤ 10) versionadas no repositório:"
          python3 analyze_ns.py $(for f in tg_N64_Re*.csv; do r=${f#tg_N64_Re}; echo "${r%.csv} $f"; done)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atk-ns-data
          path: atk-kernel/ns_data/*.csv
